name: Verify Droid setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Create app token for both repos
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DROID_APP_ID }}
          private-key: ${{ secrets.DROID_APP_PRIVATE_KEY }}
          owner: bobbyhyam
          repositories: |
            OrderBookMatchingEngine
            OrderBookMatchingEngine-rehearsal

      - name: Read both repos with the app token
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          echo "Repos this token can reach:"
          gh api installation/repositories --jq '.repositories[] | "  \(.full_name) (issues on: \(.has_issues))"'
          for r in OrderBookMatchingEngine OrderBookMatchingEngine-rehearsal; do
            gh api "repos/bobbyhyam/$r/contents/README.md" --jq '"  read README.md from \(.path) in '"$r"': OK"'
          done

      - name: Check FACTORY_API_KEY is present
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: test -n "$FACTORY_API_KEY" && echo "FACTORY_API_KEY is present"

      - name: Install Droid CLI
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run a read-only droid exec
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          droid --version
          droid exec "Reply with exactly the word OK and nothing else."
