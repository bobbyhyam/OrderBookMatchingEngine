name: Droid Tag

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  actions: read

jobs:
  droid:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@droid')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@droid')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@droid'))
    runs-on: ubuntu-latest
    steps:
      - name: Create Droid app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DROID_APP_CLIENT_ID }}
          private-key: ${{ secrets.DROID_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Droid
        uses: Factory-AI/droid-action@v13
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          github_token: ${{ steps.app.outputs.token }}
          review_depth: deep
          review_model: gpt-6.1-sol
          security_model: gpt-6.1-sol
